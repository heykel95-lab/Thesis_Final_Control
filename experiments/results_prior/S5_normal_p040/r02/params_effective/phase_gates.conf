# ==============================================================================
# Phase-transition gates
# ==============================================================================
# Defining surface clearance and Cartesian hold impedance during confirmation.

# Defining tool-contact clearance above the surface [m].
descend_surface_clearance = 0.020

# Selector: 0 = continue directly; 1 = wait for confirmation before setup.
pause_before_setup = 0
# Selector: 0 = continue directly; 1 = wait for confirmation before grinding.
pause_before_grind = 1

# Selector: 0 = use base-frame translational gains; 1 = use surface-frame gains.
pause_hold_translation_surface_frame = 1

# Defining base-frame translational hold stiffness [N/m] and damping [N s/m].
pause_hold_Kp_x = 2000.0
pause_hold_Kp_y = 2000.0
pause_hold_Kp_z = 350.0

# Defining base-frame translational hold damping [N s/m].
pause_hold_Dp_x = 10.0
pause_hold_Dp_y = 10.0
pause_hold_Dp_z = 175.0

# Defining surface-frame translational hold stiffness [N/m].
pause_hold_Kp_surface_tangent1 = 2000.0
pause_hold_Kp_surface_tangent2 = 2000.0
pause_hold_Kp_surface_normal = 350.0

# Defining surface-frame translational hold damping [N s/m].
pause_hold_Dp_surface_tangent1 = 10.0
pause_hold_Dp_surface_tangent2 = 10.0
pause_hold_Dp_surface_normal = 175.0

# Selector: 0 = use base-frame rotational gains; 1 = use surface-frame gains.
pause_hold_rotation_surface_frame = 1

# Defining base-frame rotational hold stiffness [N m/rad].
pause_hold_KR_x = 5.0
pause_hold_KR_y = 5.0
pause_hold_KR_z = 50.0

# Defining base-frame rotational hold damping [N m s/rad].
pause_hold_DR_x = 10.01
pause_hold_DR_y = 10.01
pause_hold_DR_z = 10.0

# Defining surface-frame rotational hold stiffness [N m/rad].
pause_hold_KR_surface_tangent1 = 5.0
pause_hold_KR_surface_tangent2 = 5.0
pause_hold_KR_surface_normal = 50.0

# Defining surface-frame rotational hold damping [N m s/rad].
pause_hold_DR_surface_tangent1 = 10.01
pause_hold_DR_surface_tangent2 = 10.01
pause_hold_DR_surface_normal = 10.0

# Selector: 0 = use configured damping; 1 = calculate damping automatically.
pause_hold_auto_damping = 1
