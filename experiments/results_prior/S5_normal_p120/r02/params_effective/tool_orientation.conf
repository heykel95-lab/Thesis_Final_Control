# ==============================================================================
# Tool orientation
# ==============================================================================
# Defining the tool axis, surface-relative offsets, and rotational constraints.

# Defining the controlled tool axis in the end-effector frame [-].
tool_axis_ee_x = 0.0
tool_axis_ee_y = 0.0
tool_axis_ee_z = 1.0

# Selector: -1 = align opposite the surface normal; 1 = align with the normal.
tool_axis_target_sign = -1.0

# Defining orientation offsets about surface axes [deg].
tool_target_offset_tangent1_deg = 10.0
tool_target_offset_tangent2_deg = 0.0
tool_target_offset_normal_deg = 90.0
# Selector: 0 = preserve the initial twist; 1 = command the normal-axis offset.
command_tool_twist = 1

# Selector: 0 = release rotation about the surface normal; 1 = constrain it.
constrain_rotation_about_alignment_normal = 1
# Selector: 0 = release rotation about surface tangent 1; 1 = constrain it.
constrain_rotation_about_alignment_tangent1 = 1
# Selector: 0 = release rotation about surface tangent 2; 1 = constrain it.
constrain_rotation_about_alignment_tangent2 = 1
