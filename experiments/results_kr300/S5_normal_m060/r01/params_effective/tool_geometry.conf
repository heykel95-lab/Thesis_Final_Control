# ==============================================================================
# Tool contact geometry
# ==============================================================================
# Defining the rectangular contact face in the end-effector frame.

# Selector: 0 = control the TCP; 1 = generate translation commands for the contact point.
use_tool_contact_point_control = 1
# Selector: 0 = use the contact-face center; 1 = select the leading edge or corner automatically.
auto_select_tool_contact_edge = 1

# Defining the contact-face center [m].
tool_contact_face_center_ee_x = 0.0
tool_contact_face_center_ee_y = 0.0
tool_contact_face_center_ee_z = 0.020

# Defining the contact-face half-width vector [m].
tool_contact_half_width_ee_x = 0.020
tool_contact_half_width_ee_y = 0.0
tool_contact_half_width_ee_z = 0.0

# Defining the contact-face half-length vector [m].
tool_contact_half_length_ee_x = 0.0
tool_contact_half_length_ee_y = 0.060
tool_contact_half_length_ee_z = 0.0

# Defining projection tolerance for tied edge or corner selection [m].
tool_contact_feature_tie_tolerance = 0.0001
