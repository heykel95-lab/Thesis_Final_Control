# ==============================================================================
# Nullspace control
# ==============================================================================
# Defining redundant-axis damping and singular-value conditioning.

# Selector: 0 = off; 1 = damping only; 2 = singular-value conditioning only;
# 3 = damping and singular-value conditioning.
nullspace_mode = 1

# Defining nullspace damping [N m s/rad] and conditioning torque [N m].
nullspace_damping = 20.0
nullspace_sigma_gain = 1.0

# Defining SVD probe step [rad], singular-value deadband [-], and relative tolerance [-].
nullspace_probe_step_rad = 0.08
nullspace_sigma_deadband = 0.000001
nullspace_svd_relative_tolerance = 0.0001
