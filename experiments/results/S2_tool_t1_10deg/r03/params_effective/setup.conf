# ==============================================================================
# Setup phase
# ==============================================================================
# Defining contact preload, Cartesian impedance, and compliance-center coupling.

# Defining phase timing [s] and termination moment [N m].
setup_min_time = 2.0
setup_timeout = 5.0
setup_moment_threshold = 150.0

# Defining virtual-penetration speed [m/s] and final depth [m].
setup_push_speed = 0.080
setup_push_end = 0.240

# Selector: 0 = use base-frame translational gains; 1 = use surface-frame gains.
setup_translation_surface_frame = 1

# Defining base-frame translational stiffness [N/m].
setup_Kp_x = 2000.0
setup_Kp_y = 2000.0
setup_Kp_z = 350.0

# Defining base-frame translational damping [N s/m].
setup_Dp_x = 10.0
setup_Dp_y = 10.0
setup_Dp_z = 175.0

# Defining surface-frame translational stiffness [N/m].
setup_Kp_surface_tangent1 = 2000.0
setup_Kp_surface_tangent2 = 2000.0
setup_Kp_surface_normal = 350.0

# Defining surface-frame translational damping [N s/m].
setup_Dp_surface_tangent1 = 10.0
setup_Dp_surface_tangent2 = 10.0
setup_Dp_surface_normal = 175.0

# Defining surface-frame rotational stiffness [N m/rad].
setup_KR_normal = 50.0
setup_KR_tangent1 = 5.0
setup_KR_tangent2 = 5.0

# Defining surface-frame rotational damping [N m s/rad].
setup_DR_normal = 10.0
setup_DR_tangent1 = 10.01
setup_DR_tangent2 = 10.01

# Selector: 0 = use configured damping; 1 = calculate damping automatically.
setup_auto_damping = 1
# Defining the automatic damping ratio [-].
setup_auto_damping_factor = 1.0

# Selector: 0 = decoupled impedance at the TCP; 1 = shift impedance from a virtual center.
use_virtual_compliance_center = 1

# When the virtual center is enabled, selecting exactly one definition below.
# Selector: 0 = do not select the tool-frame definition;
# 1 = define p_C - p_TCP in the end-effector frame.
compliance_center_in_tool_frame = 1
# Defining the tool-frame center offset p_C - p_TCP [m].
compliance_center_offset_ee_x = 0.000000
compliance_center_offset_ee_y = -0.060000
compliance_center_offset_ee_z = 0.000000

# Selector: 0 = do not select the surface-frame definition;
# 1 = define r_c = p_TCP - p_C in surface axes.
compliance_lever_in_surface_frame = 0
# Defining r_c = p_TCP - p_C in surface axes [tangent1, tangent2, normal], [m].
r_tcp_from_compliance_center_surface_tangent1 = 0.0
r_tcp_from_compliance_center_surface_tangent2 = 0.0
r_tcp_from_compliance_center_surface_normal = 0.0

# Selector: 0 = omit the compliance report; 1 = print it after setup.
print_compliance_diagnostics = 1
