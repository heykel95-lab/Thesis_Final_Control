# ==============================================================================
# Gripper and tool transfer
# ==============================================================================
# Defining startup action, gripper commands, and tool-holder posture.

# Selector: 0 = no automatic gripper action; 1 = execute the configured startup action.
perform_gripper_action_before_run = 0
# Selector: 0 = continue after a failed action; 1 = abort the run.
abort_on_gripper_action_failure = 0
# Selector: 0 = open the gripper; 1 = grasp the tool.
gripper_startup_grasp_tool = 1

# Defining tool grasp width [m], speed [m/s], force [N], and tolerances [m].
gripper_grasp_width = 0.066
gripper_grasp_speed = 0.050
gripper_grasp_force = 60.0
gripper_grasp_epsilon_inner = 0.005
gripper_grasp_epsilon_outer = 0.010

# Defining gripper opening width [m] and speed [m/s].
gripper_open_width = 0.067
gripper_open_speed = 0.050

# Selector: 0 = disable the tool-holder sequence; 1 = enable it.
use_tool_pickup = 1
# Defining pickup descent speed factor [-] and standoff distance [m].
pickup_descend_speed_factor = 0.15
pickup_standoff = 0.05

# Defining the tool-holder joint posture [rad].
q_pickup_1 = 0.407690
q_pickup_2 = 0.362496
q_pickup_3 = 0.043206
q_pickup_4 = -2.559797
q_pickup_5 = -0.001279
q_pickup_6 = 2.908839
q_pickup_7 = 1.214087
