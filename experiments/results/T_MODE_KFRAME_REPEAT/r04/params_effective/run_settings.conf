# ==============================================================================
# Run settings
# ==============================================================================
# Defining robot connection, run duration, logging, and terminal update period.

# Defining the robot FCI address.
robot_ip = 172.16.0.2

# Defining run duration [s]: 0.0 = operator-controlled stop; value > 0 = timed stop.
experiment_duration = 34.0

# Defining the primary CSV output path.
csv_file_name = logs/surface_grinding_controller_log.csv
# Defining log decimation [-]: 1 = every cycle; n > 1 = every nth cycle.
log_every_n_cycles = 1
# Defining the maximum number of rows retained in memory [-].
max_log_rows = 120000

# Defining the terminal update period [s].
debug_period = 0.20
