# ==============================================================================
# Cartesian pose hold
# ==============================================================================
# Defining base-frame stiffness and damping for pose hold.

# Defining translational stiffness [N/m].
hold_Kp_x = 2000.0
hold_Kp_y = 2000.0
hold_Kp_z = 2000.0

# Defining translational damping [N s/m].
hold_Dp_x = 50.0
hold_Dp_y = 50.0
hold_Dp_z = 50.0

# Defining rotational stiffness [N m/rad].
hold_KR_x = 50.0
hold_KR_y = 50.0
hold_KR_z = 50.0

# Defining rotational damping [N m s/rad].
hold_DR_x = 8.0
hold_DR_y = 8.0
hold_DR_z = 8.0

# Selector: 0 = use configured damping; 1 = calculate damping automatically.
hold_auto_damping = 0
# Selector: 0 = use calculated damping directly; 1 = scale it to match manual damping at the reference pose.
hold_auto_match_manual_damping = 1
# Defining the automatic damping ratio [-].
hold_auto_damping_factor = 1.0

# Selector: 0 = disable periodic hold output; 1 = enable it.
print_hold_debug = 1
