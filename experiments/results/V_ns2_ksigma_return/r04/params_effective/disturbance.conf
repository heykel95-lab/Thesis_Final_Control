# ==============================================================================
# Controller disturbance test
# ==============================================================================
# Defining timed manual cues and the optional automatic point-force command.

# Selector: 0 = disable disturbance cues; 1 = print the timed cues.
disturbance_cues_enabled = 0
# Defining cue times during pose hold [s].
disturbance_push_time = 1.0
disturbance_hold_time = 3.0
disturbance_release_time = 11.0

# Selector: 0 = disable automatic disturbance; 1 = apply the point-force command.
disturbance_auto_enabled = 1
# Selector: integer 1...7 = robot link receiving the commanded point force.
disturbance_link = 3
# Defining the force-application point in the selected link frame [m].
disturbance_point_link_x = 0.0
disturbance_point_link_y = 0.0
disturbance_point_link_z = 0.150
# Defining force magnitude [N], direction sign [-], release time [s], and torque limit [N m].
disturbance_force = 40.0
# Selector: -1 = reverse the calculated direction; 1 = use the calculated direction.
disturbance_direction_sign = 1.0
disturbance_release_ramp_time = 1.0
disturbance_max_tau_norm = 5.0
