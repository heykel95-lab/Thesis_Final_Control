# ==============================================================================
# Approach phase
# ==============================================================================
# Defining the tool-orientation motion, approach impedance, and surface descent.

# Selector: 0 = skip tool orientation; 1 = orient the tool before descent.
enable_orientation_phase = 1

# Defining orientation timing [s], error limits [rad], and slew rate [deg/s].
approach_orient_min_time = 1.0
approach_orient_error_threshold = 0.016
approach_orient_spin_error_threshold = 0.009
approach_orient_timeout = 8.0
approach_orient_max_rate_deg = 20.0

# Defining stiffness in surface axes [tangent1, tangent2, normal].
# Translation [N/m]; rotation [N m/rad].
approach_Kp_normal = 150.0
approach_Kp_tangent1 = 150.0
approach_Kp_tangent2 = 150.0
approach_KR_normal = 90.0
approach_KR_tangent1 = 180.0
approach_KR_tangent2 = 180.0

# Defining damping in surface axes.
# Translation [N s/m]; rotation [N m s/rad].
approach_Dp_normal = 20.0
approach_Dp_tangent1 = 20.0
approach_Dp_tangent2 = 20.0
approach_DR_normal = 12.0
approach_DR_tangent1 = 15.0
approach_DR_tangent2 = 15.0

# Selector: 0 = use the configured damping; 1 = calculate damping automatically.
approach_auto_damping = 1
# Defining the automatic damping ratio [-].
approach_auto_damping_factor = 1.9

# Defining the surface-descent speed [m/s] and maximum travel [m].
descend_speed = 0.1
descend_max_distance = 0.640
