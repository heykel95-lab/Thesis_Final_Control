# ==============================================================================
# Phase-transition gates
# ==============================================================================
# Defining surface clearance and Cartesian hold impedance during confirmation.

# Defining tool-contact clearance above the surface [m].
descend_surface_clearance = 0.020

# Selector: 0 = continue directly; 1 = wait for confirmation before setup.
pause_before_setup = 1
# Selector: 0 = continue directly; 1 = wait for confirmation before grinding.
pause_before_grind = 1

# Defining translational hold stiffness [N/m] and damping [N s/m].
pause_hold_Kp_x = 2000.0
pause_hold_Kp_y = 2000.0
pause_hold_Kp_z = 350.0
pause_hold_Dp_x = 10.0
pause_hold_Dp_y = 10.0
pause_hold_Dp_z = 175.0

# Defining rotational hold stiffness [N m/rad] and damping [N m s/rad].
pause_hold_KR_tangent1 = 5.0
pause_hold_KR_tangent2 = 5.0
pause_hold_KR_normal = 50.0
pause_hold_DR_tangent1 = 10.01
pause_hold_DR_tangent2 = 10.01
pause_hold_DR_normal = 10.0

# Selector: 0 = use configured damping; 1 = calculate damping automatically.
pause_hold_auto_damping = 1
