# ==============================================================================
# Grinding phase
# ==============================================================================
# Defining tangential sweep motion and terminal output.

# Selector: 0 = hold the setup preload; 1 = add the tangential sweep.
grind_sweep_enabled = 1

# Selector: 1 = sweep along surface tangent 1; 2 = sweep along surface tangent 2.
grind_tangent_axis = 2

# Defining sweep half-amplitude [m] and frequency [Hz].
grind_amplitude_m = 0.03
grind_frequency_hz = 0.2

# Selector: 0 = disable periodic grinding output; 1 = enable it.
print_grind_debug = 0
