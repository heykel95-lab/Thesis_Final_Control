# ==============================================================================
# Surface definition
# ==============================================================================
# Defining the surface point, normal orientation, and tangent direction.

# Selector: 0 = use the configured surface point; 1 = use the controller start position.
use_start_as_surface_point = 0

# Defining one point on the plane in the robot base frame [m].
# The measure_plane tool reports the seated contact-face center for these entries.
surface_point_x = 0.526
surface_point_y = 0.017
surface_point_z = 0.002

# Defining surface-normal rotations about the base x and y axes [deg].
surface_tilt_x_deg = -0.474
surface_tilt_y_deg = 2.270

# Defining the tangent-1 direction hint in the robot base frame [-].
surface_tangent1_hint_base_x = 1.0
surface_tangent1_hint_base_y = 0.0
surface_tangent1_hint_base_z = 0.0
